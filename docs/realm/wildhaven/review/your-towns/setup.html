<!doctype html><html><head><meta charset="utf-8"><title>Isolated save migration review</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;background:#f3f4e8;color:#284a3c}button,a{font:inherit;padding:12px;margin:8px}pre{white-space:pre-wrap}</style></head><body><h1>Isolated save migration review</h1><p>Prepared towns for testing; this is not a real player save. This fixture only works on localhost:4788 and will not overwrite an existing save.</p><button id="install">Install legacy companion fixture</button><button id="audit">Audit saved towns</button><a href="../../?review=towns">Open test game</a><pre id="report" role="status"></pre><script type="module">
import {restore} from '../../js/sim.js';
const output=document.getElementById('report'), fixture=await(await fetch('./legacy-fixture.json')).json();
const allowed=location.hostname==='localhost'&&location.port==='4788';
function audit(){const raw=localStorage.getItem('wildhaven.towns.v1');const record=raw&&JSON.parse(raw);output.textContent=JSON.stringify({legacyUnchanged:Object.entries(fixture).every(([k,v])=>localStorage.getItem(k)===v),active:record?.active,towns:record?.slots.map(s=>({id:s.id,name:s.name,pair:!!s.data['wildhaven.companions.v1'],homeValid:!!restore(s.data['wildhaven.v4']),resources:JSON.parse(s.data['wildhaven.v4']).resources,research:JSON.parse(s.data['wildhaven.v4']).research.active}))},null,2);}
document.getElementById('install').onclick=()=>{if(!allowed)throw Error('Wrong origin');if(['wildhaven.v4','wildhaven.companions.v1','wildhaven.towns.v1'].some(k=>localStorage.getItem(k))) {output.textContent='Existing saves found. Nothing overwritten.';return;}for(const[k,v]of Object.entries(fixture))localStorage.setItem(k,v);output.textContent='Legacy fixture installed. Open test game to migrate.';};
document.getElementById('audit').onclick=audit;
</script></body></html>
