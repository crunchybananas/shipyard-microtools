<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gradient Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <h1>Gradient Generator</h1>
          <p>Create beautiful CSS gradients in seconds.</p>
        </div>
        <button id="randomize" class="btn primary">Randomize</button>
      </header>

      <section class="preview">
        <div id="gradientPreview" class="preview-swatch"></div>
        <div class="preview-actions">
          <button id="copyCss" class="btn">Copy CSS</button>
          <button id="copyHex" class="btn">Copy Colors</button>
        </div>
      </section>

      <section class="controls">
        <div class="control">
          <label>Type</label>
          <select id="type">
            <option value="linear">Linear</option>
            <option value="radial">Radial</option>
            <option value="conic">Conic</option>
          </select>
        </div>

        <div class="control" id="angleControl">
          <label>Angle: <span id="angleValue">135°</span></label>
          <input id="angle" type="range" min="0" max="360" value="135" />
        </div>

        <div class="control stops-control">
          <div class="stops-header">
            <label>Color stops</label>
            <button id="addStop" class="btn small">+ Add stop</button>
          </div>
          <div id="stopsList" class="stops-list"></div>
        </div>
      </section>

      <section class="output">
        <label>CSS</label>
        <pre id="cssOutput"></pre>
      </section>
    </div>

    <footer class="footer">
      Part of <a href="https://github.com/crunchybananas/shipyard-microtools">Microtools</a>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
